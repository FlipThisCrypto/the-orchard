; The Orchard — Tree firmware
; PlatformIO project supporting both classic ESP32 (WROOM-32 / WROOM-32U)
; and ESP32-S3 (Freenove S3 etc.).
;
; Default env is the WROOM-32U because that's what's in the v1
; prototype enclosure. To target an S3 board, override on the CLI:
;   pio run -e freenove_esp32s3 -t upload --upload-port COM7
;
; Build / flash:
;   pio run                    # build with default env (WROOM-32U)
;   pio run -t upload          # flash over USB
;   pio device monitor         # serial console at 115200
;
; Library docs: https://docs.platformio.org/en/latest/projectconf/index.html

[platformio]
default_envs = freenove_esp32_wroom

; -------------------------------------------------------------------
; Common settings shared by all envs.
[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
; Library + platform pins — EXACT versions (no caret), not floors.
;
; Why exact pins:
;   ^6.7.0 used to mean "any 6.x" which was fine when 6.x didn't drift.
;   In practice, arduino-esp32 inside the espressif32 platform shifted
;   HardwareSerial behavior between minor releases — GPS auto-baud
;   detection that worked on 0.3.0 stopped detecting NMEA on a fresh
;   0.4.0 build because the rebuild fetched a newer espressif32. The
;   GPS module wasn't moved or reconfigured; only the host-side UART
;   driver did. Symptoms: ~10kB/s of NMEA-shaped bytes arriving,
;   sentence framing visible (passed/failed checksum counters tick),
;   but ZERO clean checksums at any baud the probe tries.
;
;   Pinning every dep to an exact version makes future rebuilds
;   reproducible. Bumps are a deliberate edit + test, not a silent
;   drift triggered by `pio run` against an internet cache.
lib_deps =
    bblanchon/ArduinoJson@7.0.4
    mikalhart/TinyGPSPlus@1.0.3
    adafruit/Adafruit BME280 Library@2.2.4
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0
    ; ADR-0007 device signatures are secp256r1 via mbedTLS — bundled with
    ; ESP-IDF, so no extra crypto library is needed.
; Arduino-ESP32 v2.x defaults to gnu++11; our sensor.h uses
; std::make_unique (C++14+). Bump to C++17 across all envs.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ORCHARD_FIRMWARE_VERSION=\"0.5.1\"

; -------------------------------------------------------------------
; Primary target: ESP32-WROOM-32 / -32U (classic ESP32).
; This is the v1 prototype board (in the enclosure with GPS + MQ-135).
; 4MB flash. No native USB — Serial flows through the CP210x bridge.
; Status LED on GPIO 2 (Freenove convention).
;
; Flash mode / freq are pinned conservatively:
;   * dio + 40MHz works on every WROOM-32 variant we've seen.
;   * The PlatformIO esp32dev default (qio + 80MHz) is faster but is
;     marginal on some Freenove boards — it leads to intermittent
;     `flash read err, 1000` bootloops.
;   * If you have a known-good board, you can try the faster combo
;     with: -D `board_build.flash_mode = qio` etc.
[env:freenove_esp32_wroom]
platform = espressif32@6.7.0
board = esp32dev
build_flags =
    ${env.build_flags}
    -D ORCHARD_PIN_STATUS_LED=2
    ; This breakout doesn't expose ESP32 UART2 defaults (GPIO 16/17).
    ; Move GPS UART to GPIO 18/19 (both real output-capable pins on
    ; the right header, no strapping role).
    -D ORCHARD_PIN_GPS_RX=18
    -D ORCHARD_PIN_GPS_TX=19
    ; Phase 9.0: board hint emitted by HW_INFO so the wizard can
    ; pick the right firmware variant.
    -D ORCHARD_BOARD_HINT=\"wroom32u\"
board_build.flash_mode = dio
board_build.flash_freq = 40m
; Uses Arduino-ESP32's built-in default.csv partition table
; (4MB OTA-capable). No custom partitions.csv needed.

; -------------------------------------------------------------------
; Secondary target: Freenove ESP32-S3 (8MB flash, native USB-CDC,
; status LED on GPIO 48). Not currently the v1 prototype, but kept
; here so we can flash an S3 Tree when one is wired up.
[env:freenove_esp32s3]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ORCHARD_PIN_STATUS_LED=48
    ; --- S3 pin overrides ---------------------------------------------
    ; The defaults in pins.h were chosen for the classic ESP32 (WROOM).
    ; The S3 module (ESP32-S3-WROOM-1/-1U) doesn't break out GPIO 22-25 —
    ; they're used internally for the SPI flash. Anything pointed at
    ; them fails at runtime: i2cInit fails with "scl gpio number error"
    ; on GPIO 22, pinMode fails with "Invalid pin selected" on GPIO 25.
    ; Map to S3-valid ADC1 pins that aren't otherwise spoken for.
    -D ORCHARD_PIN_MQ135_ADC=7
    -D ORCHARD_PIN_I2C_SCL=9
    -D ORCHARD_PIN_DS18B20_DATA=10
    ; Phase 9.0: board hint emitted by HW_INFO so the wizard can
    ; pick the right firmware variant.
    -D ORCHARD_BOARD_HINT=\"freenove-s3\"
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
board_build.flash_size = 8MB

; -------------------------------------------------------------------
; Tertiary target: ESP32-S3 board with an external UART-to-USB bridge
; (WCH CH343 / CP210x / etc.) wired to UART0 instead of the S3's
; native USB peripheral. Common on dev boards that expose two USB-C
; ports — one for native USB, one for UART. Plug into the UART port
; and you'll see this VID:PID range on the host.
;
; Same chip + same partitions + same flash size as freenove_esp32s3,
; just WITHOUT the ARDUINO_USB_MODE / ARDUINO_USB_CDC_ON_BOOT flags
; so Arduino's Serial flows over UART0 instead of native USB CDC.
[env:freenove_esp32s3_uart]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    ; EXPLICITLY force Arduino's `Serial` macro to point at UART0
    ; (HardwareSerial(0)), not the native USB CDC. arduino-esp32's
    ; esp32-s3-devkitc-1 variant defaults to `ARDUINO_USB_CDC_ON_BOOT=1`
    ; if the build doesn't set it — which routes Serial.println() to
    ; native USB and produces NOTHING on the CH343 UART bridge.
    ; Setting it to 0 here makes Serial == Serial0 == UART0 → GPIO 43/44
    ; → the bridge → COM11/COM12. ARDUINO_USB_MODE=1 keeps the USB
    ; peripheral configured as device-mode (the default for an S3 dev
    ; board) but with CDC-on-boot disabled.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ORCHARD_PIN_STATUS_LED=48
    ; Same S3 pin overrides as the native-USB env — see that block
    ; for the why. GPIO 22 (default SCL in pins.h) and GPIO 25
    ; (default DS18B20 DATA) are NOT broken out on the S3 module.
    -D ORCHARD_PIN_MQ135_ADC=7
    -D ORCHARD_PIN_I2C_SCL=9
    -D ORCHARD_PIN_DS18B20_DATA=10
    -D ORCHARD_BOARD_HINT=\"freenove-s3-uart\"
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
