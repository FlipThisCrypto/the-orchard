# Alembic config for The Orchard oracle.
#
# The database URL is injected from the oracle's settings in env.py
# (ORCHARD_ORACLE_DB_URL / oracle/.env), so migrations always target the
# same DB the running service does — it is intentionally NOT set here.
#
# Run from the repo root:
#   alembic upgrade head                              # apply migrations
#   alembic stamp head                                # mark an already-created DB as up to date
#   alembic revision --autogenerate -m "describe it"  # author a new migration
[alembic]
script_location = oracle/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
