; The Orchard — Panel firmware (Phase 9.2)
; Board: Waveshare ESP32-S3-Touch-LCD-4.3 / 4.3B (800x480 RGB565 parallel)
;   - 8MB flash, 8MB OCTAL (OPI) PSRAM
;   - serial/flashing via an onboard CH343 UART bridge -> CDC_ON_BOOT=0
;
; PHASE 2.5 — DOUBLE-BUFFERED video (tear-free).
;   The stock Arduino core (espressif32 6.x / IDF 4.4) only exposes a SINGLE
;   RGB framebuffer, so every frame update tore -> "choppy". This env moves to
;   the pioarduino community core (arduino-esp32 3.x / IDF 5.x), whose esp_lcd
;   RGB driver supports `num_fbs = 2`: we decode each frame into the back
;   buffer and the EDMA swaps it in only after the current frame finishes
;   scanning out. No tearing. We drive esp_lcd directly (no Arduino_GFX).
;
; The previous single-buffer version is preserved in:
;   main_singlebuf_0.2.4.bak.txt + platformio_singlebuf.bak.txt
; (restore those + revert this platform line to roll back.)

[platformio]
default_envs = waveshare_s3_touch_43b

[env:waveshare_s3_touch_43b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = partitions_panel_8mb.csv
board_build.filesystem = littlefs

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -D ORCHARD_PANEL_VERSION=\"0.3.5\"
build_unflags = -std=gnu++11

lib_deps =
    bitbank2/JPEGDEC@^1.6.0
